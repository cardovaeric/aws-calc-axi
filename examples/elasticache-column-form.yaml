name: axi-e2e ElastiCache column form
currency: USD
locale: en_US
services:
  - code: amazonElastiCache
    region: us-east-2
    set:
      columnFormIPM_dsp:
        Cache Engine: Redis
        TermType: OnDemand
      columnFormIPM:
        Number of Nodes: 2
        Instance Type: cache.m5.xlarge
