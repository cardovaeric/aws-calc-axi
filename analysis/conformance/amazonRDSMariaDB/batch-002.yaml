name: axi-conformance amazonRDSMariaDB-002
currency: USD
locale: en_US
services:
  - code: amazonRDSMariaDB
    region: us-east-1
    template: rdsForMariaDB
    set:
      createRDSProxy: "1"
      storageVolume: General Purpose
      provisionedIOPS: 1000
      provisionedIOPSIO2: 1000
      storageAmount:
        value: 100
        unit: gb|NA
      gp3Iops: 12000
      gp3Throughput:
        value: 500
        unit: mbps
      dedicatedLogVolume: "1"
      DatabaseInsightsSelected: "1"
      retentionPeriod: "0"
      additionalBackupStorage:
        value: 1
        unit: gb|NA
      snapshotExport:
        value: 10
        unit: perMonth
