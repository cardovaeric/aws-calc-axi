      columnFormIPM:
      - Number of Nodes: 1
        Instance Type: db.t3.micro
        Deployment Option: Single-AZ
        TermType: OnDemand
        LeaseContractLength: ''
        PurchaseOption: ''
      createRDSProxy: '1'
      storageType: General Purpose-GP3
      storageAmount:
        value: 100
        unit: gb|NA
      gp3Iops: 12000
      gp3Throughput:
        value: 500
        unit: mbps
      dedicatedLogVolume: '1'
      DatabaseInsightsSelected: '1'
      retentionPeriod: '3'
      addRDSExtendedSupport: '1'
      RDSExtendedSupportYear: year12
      numberOfHoursOnES:
        value: 100
        unit: perMonth
      additionalBackupStorage:
        value: 50
        unit: gb|NA
      snapshotExport:
        value: 10
        unit: perMonth
  - code: amazonRDSMariaDB
    region: us-east-2
    set:
      columnFormIPM:
      - Number of Nodes: 1
        Instance Type: db.t3.micro
        Deployment Option: Single-AZ
        TermType: OnDemand
        LeaseContractLength: ''
        PurchaseOption: ''
      createRDSProxy: '1'
      storageType: General Purpose-GP3
      storageAmount:
        value: 100
        unit: gb|NA
      gp3Iops: 12000
      gp3Throughput:
        value: 500
        unit: mbps
      dedicatedLogVolume: '1'
      DatabaseInsightsSelected: '1'
      retentionPeriod: '3'
      addRDSExtendedSupport: '1'
      RDSExtendedSupportYear: year12
      numberOfHoursOnES:
        value: 100
        unit: perMonth
      additionalBackupStorage:
        value: 50
        unit: gb|NA
      snapshotExport:
        value: 10
