name: axi-conformance amazonElasticBlockStore-020
currency: USD
locale: en_US
services:
  - code: amazonElasticBlockStore
    region: us-east-2
    template: elasticBlockStore
    set:
      numberOfInstances: 1
      durationOfInstanceRuns:
        value: 730
        unit: hours
      storageType: Storage General Purpose GB Mo
      storageAmount:
        value: 30
        unit: gb|NA
      iops: 3000
