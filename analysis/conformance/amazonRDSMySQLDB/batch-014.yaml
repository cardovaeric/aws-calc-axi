name: axi-conformance amazonRDSMySQLDB-014
currency: USD
locale: en_US
services:
  - code: amazonRDSMySQLDB
    region: us-east-2
    template: mySQLDB
    set:
      createRDSProxy: "1"
      storageType: General Purpose
      iops: 1
      provisionedIOPSIO2: 1000
      storageAmount:
        value: 100
        unit: gb|NA
      gp3Iops: 12000
      gp3Throughput:
        value: 500
        unit: mbps
      dedicatedLogVolume: "0"
      DatabaseInsightsSelected: "1"
      retentionPeriod: "9"
      addRDSExtendedSupport: "1"
      RDSExtendedSupportYear: year12
      numberOfHoursOnES:
        value: 10
        unit: perMonth
      additionalBackupStorage:
