name: axi-conformance amazonRDSMySQLDB-007
currency: USD
locale: en_US
services:
  - code: amazonRDSMySQLDB
    region: us-east-1
    template: mySQLDB
    set:
      createRDSProxy: "1"
      storageType: General Purpose
      iops: 1
      provisionedIOPSIO2: 1000
      storageAmount:
        value: 100
        unit: gb|NA
      gp3Iops: 12000
      gp3Throughput:
        value: 500
        unit: mbps
      dedicatedLogVolume: "0"
      DatabaseInsightsSelected: "1"
      retentionPeriod: "14"
      addRDSExtendedSupport: "1"
      RDSExtendedSupportYear: year12
      numberOfHoursOnES:
        value: 10
        unit: perMonth
      additionalBackupStorage:
        value: 1
        unit: gb|NA
      snapshotExport:
        value: 10
