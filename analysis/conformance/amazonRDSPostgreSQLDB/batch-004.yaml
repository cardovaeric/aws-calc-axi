name: axi-conformance amazonRDSPostgreSQLDB-004
currency: USD
locale: en_US
services:
  - code: amazonRDSPostgreSQLDB
    region: us-east-1
    template: rdsForPostgreSQL
    set:
      createRDSProxy: "1"
      storageVolume: General Purpose-GP3
      provisioningIOPS: 1000
      provisionedIOPSIO2: 1000
      storageAmount:
        value: 100
        unit: gb|NA
      gp3Iops: 12000
      gp3Throughput:
        value: 500
        unit: mbps
      dedicatedLogVolume: "0"
      DatabaseInsightsSelected: "1"
      retentionPeriod: "0"
      addRDSExtendedSupport: "1"
      RDSExtendedSupportYear: year3
      numberOfHoursOnES:
        value: 10
        unit: perMonth
      additionalBackupStorage:
        value: 1
        unit: gb|NA
      snapshotExport:
